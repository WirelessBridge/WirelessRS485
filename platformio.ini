; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
build_type = release
; framework = stm32cube

platform_packages = toolchain-gccarmnoneeabi

debug_build_flags = -Os -g

build_flags = 
	-D HSE_VALUE=8000000U
	-D USE_HAL_DRIVER
	-D CURRENT_LOG_LEVEL=4
	-D SHOW_RUNTIME_STATS=0
	-D RUNTIME_STATS_UPDATE_PERIOD_MS=2000
	-std=gnu++2a
	-fno-strict-aliasing
	-I Drivers/STM32F1xx_HAL_Driver/Inc
	-I Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
	-I Drivers/CMSIS/Device/ST/STM32F1xx/Include
	-I Drivers/CMSIS/Include
	; -I .pio/libdeps/genericSTM32F407VET6
	-I include
	-I Core/Inc
	-I Middlewares/Third_Party/FreeRTOS/Source/include
	-I Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
	-I Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM3

	-fno-strict-aliasing -Os
	-Wl,--no-warn-rwx-segments
	-fno-exceptions
	-Wl,--gc-sections
	; -Os

build_src_filter = 
	+<*>
	+<../Core/Src>
	+<../Core/Startup>
	
	+<../Drivers/STM32F1xx_HAL_Driver/Src>

	+<../Middlewares/Third_Party/FreeRTOS/Source>

debug_tool = jlink
upload_protocol = jlink
board_build.ldscript = STM32F103C8TX_FLASH.ld